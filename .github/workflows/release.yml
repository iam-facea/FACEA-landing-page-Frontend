name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version MAJOR.MINOR.PATCH without v (example: 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

# Serialize the entire production flow, including checks; never cancel a live publication.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main before checkout or CI
        shell: bash
        run: '[[ "$GITHUB_REF" == "refs/heads/main" ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate version and reject existing tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs preflight

  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Tag checked commit and publish GitHub Release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy checked commit to Render and smoke routes
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_SITE_URL: ${{ vars.RENDER_SITE_URL }}
        run: node scripts/deploy-render.mjs
